name: Dashboard Verisini Güncelle

on:
  push:
    branches: [ main ]
    paths:
      - 'saha_durum_operasyon_tablosu.xlsx'
      - 'scripts/parse_saha_durum.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install openpyxl

      - name: Excel'i JSON'a çevir
        run: python scripts/parse_saha_durum.py saha_durum_operasyon_tablosu.xlsx data/dashboard-data.json

      - name: Değişiklik varsa commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "Veri değişmemiş, commit atılmıyor."
          else
            git commit -m "chore: dashboard verisini güncelle (otomatik)"
            git push
          fi
